[package]
default-run = "rand-ndarray-csv-bfgs"
name = "rand-ndarray-csv-bfgs"
version = "0.1.0"
edition = "2024"

[dependencies]
num-traits = "0.2.19"
rand = { version = "0.9.2" }
rand_mt = "5.0.0"
ndarray = "0.17.2"
libm = "0.2.16"
csv = "1.4.0"
ndarray-csv = "0.5.4"
wolfe_bfgs = "0.2.2"

[profile.release]
lto = true
codegen-units = 1
panic = 'abort' 
strip = "symbols"
opt-level = "z"

